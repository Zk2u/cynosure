name: Publish

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; jobs override only what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify that the tag matches the package version and points at reviewed main.
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the tag target can be checked against main.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # The tag text crosses into the shell only through the environment, never
      # through `${{ }}` interpolation into `run:` source.
      - name: Extract version from tag
        id: tag_version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "tag '$version' is not a valid semver version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Extract version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify versions match
        env:
          TAG_VERSION: ${{ steps.tag_version.outputs.VERSION }}
          CARGO_VERSION: ${{ steps.cargo_version.outputs.VERSION }}
        run: |
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Versions match: $TAG_VERSION"

      - name: Verify the tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag target $GITHUB_SHA is not reachable from origin/main" >&2
            exit 1
          fi
          echo "Tag target is on main"

  # Run all tests before publishing
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run tests
        run: cargo test --all-features --locked
      - name: Run doc tests
        run: cargo test --doc --all-features --locked

  # Run miri tests
  miri:
    name: Miri
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Run Miri
        run: |
          cargo +nightly miri test --locked --lib -- --skip async
        env:
          MIRIFLAGS: "-Zmiri-backtrace=full -Zmiri-strict-provenance"

  # Check that documentation builds
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Build documentation
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Dry run of publish (builds and verifies the exact package)
  publish-dry-run:
    name: Publish (dry run)
    runs-on: ubuntu-latest
    needs: [test, miri, doc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Dry run publish
        run: cargo publish --dry-run --locked

  # Actual publish to crates.io
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: publish-dry-run
    # Only run on non-pre-release tags
    if: "!contains(github.ref, '-')"
    # A protected environment (add required reviewers in repository settings) is
    # the approval gate for the credential-bearing step.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # `--no-verify` runs no build script or proc macro, so repository- and
      # dependency-controlled code never executes with CRATES_TOKEN in scope.
      # The package was already built and verified by `publish-dry-run`, on the
      # same revision, with no secret present.
      - name: Publish to crates.io
        run: cargo publish --no-verify --locked --token "$CRATES_TOKEN"
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

  # Create GitHub release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
